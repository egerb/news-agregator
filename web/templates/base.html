<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Aggregator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <a href="/" class="flex items-center px-2 py-2 text-gray-700 hover:text-gray-900">Dashboard</a>
                    <a href="/config" class="flex items-center px-2 py-2 text-gray-700 hover:text-gray-900">Configuration</a>
                    <a href="/scheduler" class="flex items-center px-2 py-2 text-gray-700 hover:text-gray-900">Scheduler</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        {{block "content" .}}{{end}}
    </main>
</body>
</html>
